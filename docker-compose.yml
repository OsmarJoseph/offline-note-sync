services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: offline_note_sync
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'offline_note_sync']
      interval: 2s
      timeout: 2s
      retries: 15
